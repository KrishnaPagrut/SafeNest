[project]
name = "safenest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.50",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "meta-sam-parser>=0.1.0",
  "pillow>=10.4",
  "reportlab>=4.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: FastAPI's File()/Form() defaults are the framework idiom.
# BLE001: model calls must degrade gracefully (a failed SAM/critic call never kills a scan); each site logs.
# ASYNC230: event-log appends are tiny local writes; not worth a thread hop.
ignore = ["B008", "BLE001", "ASYNC230"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
